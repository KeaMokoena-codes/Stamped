name: CI

# Everyone commits straight to main — no PR gate — so CI runs on every
# push to main and is the only automated check this project has.
# Treat a red run as "stop and fix before the next commit", not as
# something to come back to later.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-guardrails:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Require working ML-DSA
        run: python scripts/check_liboqs.py

      - name: Run guardrail checks
        run: python scripts/ci_guardrails.py

      - name: Run test suite
        run: python -m pytest -v --tb=short --strict-config --strict-markers --cov=seal --cov=access --cov=verifier --cov=capture --cov-branch --cov-report=term

      - name: Run demo end-to-end contract
        run: python -m scripts.run_e2e

      # ACCEPTED RISK (docs/threat-model.md, "Compromised dependency"): xhtml2pdf==0.2.28 caps
      # Pillow below 13, and these 38 Pillow advisories are only fixed in 13.0.0. They are ignored
      # BY ID, so any new advisory (in Pillow or anything else) still fails this step.
      # Remove this list when xhtml2pdf allows Pillow 13 or the PDF dependency is replaced.
      - name: Run dependency audit
        run: |
          python -m pip_audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-4327 \
            --ignore-vuln PYSEC-2026-4328 \
            --ignore-vuln PYSEC-2026-4326 \
            --ignore-vuln GHSA-p4wg-p73j-c528 \
            --ignore-vuln GHSA-65qm-jvmh-6pqg \
            --ignore-vuln GHSA-58r4-6rv3-gfh8 \
            --ignore-vuln GHSA-pchr-8j38-3x4p \
            --ignore-vuln GHSA-q45j-58j2-45rg \
            --ignore-vuln GHSA-462x-pgg6-55fp \
            --ignore-vuln GHSA-c6hw-5grf-ff96 \
            --ignore-vuln GHSA-vx6w-vv9f-6gvg \
            --ignore-vuln GHSA-7mwm-ghpf-9vrm \
            --ignore-vuln GHSA-w889-685w-c8fh \
            --ignore-vuln GHSA-j4m9-6w36-pw47 \
            --ignore-vuln GHSA-fc9g-5qg7-mf45 \
            --ignore-vuln GHSA-cp9v-662q-vvx9 \
            --ignore-vuln GHSA-22hg-r758-rrw9 \
            --ignore-vuln GHSA-74r2-7ff9-mjj2 \
            --ignore-vuln GHSA-xgh8-jp6q-p5x8 \
            --ignore-vuln GHSA-254f-3936-288h \
            --ignore-vuln GHSA-jg86-v3jv-hrpm \
            --ignore-vuln GHSA-f2g6-542v-9j58 \
            --ignore-vuln GHSA-5xm2-6676-qcp9 \
            --ignore-vuln GHSA-gg2r-wvfm-q9rx \
            --ignore-vuln GHSA-332p-7hrc-92wf \
            --ignore-vuln GHSA-24rc-8hj2-v98c \
            --ignore-vuln GHSA-4rm8-3hmm-39fg \
            --ignore-vuln GHSA-mrfp-p49p-3hf2 \
            --ignore-vuln GHSA-3j72-p6qg-6xp7 \
            --ignore-vuln GHSA-v9pv-5gc8-w2m6 \
            --ignore-vuln GHSA-g4qv-2jxx-769h \
            --ignore-vuln GHSA-g842-9rc4-69pw \
            --ignore-vuln GHSA-9v9v-9qvf-h2hj \
            --ignore-vuln GHSA-g7cr-3p24-7wf7 \
            --ignore-vuln GHSA-p8hx-v2p6-rp84 \
            --ignore-vuln GHSA-78g4-xqwv-q3g8 \
            --ignore-vuln GHSA-654x-cwwv-5j9c \
            --ignore-vuln GHSA-5x8w-8jj5-q52h

      - name: Run Bandit
        run: bandit -r app access capture detect ingest report seal verifier -lll

      - name: Run Ruff security rules
        run: ruff check --select S app access capture detect ingest report seal verifier

      - name: Run mypy on security-critical modules
        run: mypy --ignore-missing-imports --follow-imports=silent capture/auth.py capture/listener.py

      - name: Run Semgrep
        run: semgrep scan --error --config p/python --config p/flask --config p/owasp-top-ten app access capture detect ingest report seal verifier