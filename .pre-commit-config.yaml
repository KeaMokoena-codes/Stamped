repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: Scan staged changes for secrets
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
      - id: ruff-check
        name: Ruff security and code checks
        entry: ruff check --select S
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check
        language: system
        types: [python]
